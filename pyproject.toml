[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traefik-dns-sync"
version = "0.1.0"
description = "Sync Traefik Docker labels to DNS providers (OPNsense Unbound, UniFi Gateway)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Marky Egeback" },
]
keywords = ["traefik", "dns", "docker", "opnsense", "unifi", "external-dns"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "docker>=7.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "dnspython>=2.6",
]

[project.scripts]
traefik-dns-sync = "traefik_dns_sync.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "respx>=0.21",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
